spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: Tarikh-HikariPool

  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  access-expiry: 86400000
  refresh-expiry: 604800000
  token-expiry: 86400000

# Object storage. Empty defaults keep the app bootable when storage is not provisioned yet —
# document endpoints then return 502 until these are set.
storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:tarikh-documents}
    region: ${MINIO_REGION:us-east-1}
    # Must be reachable from the user's browser: presigned URLs are generated against it.
    upload-expiry-seconds: 1800
    download-expiry-seconds: 900
    max-file-size-bytes: 52428800
    default-quota-bytes: ${DEFAULT_STORAGE_QUOTA_BYTES:5368709120}

super-admin:
  registration-secret: ${SUPER_ADMIN_REGISTRATION_SECRET}

# Boot fallback only — the GLOBAL APP_PRODUCTION config key wins once the DB is seeded.
# Keep this true so the MFA bypass stays off even on a database that was never seeded.
app:
  name: ${APP_NAME:Tarikh}
  production: true