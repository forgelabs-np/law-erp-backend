# src/main/resources/application.yml
spring:
  application:
    name: NepalCRM

  # Document upload is one multipart request now, so Tomcat must accept the body. This is the
  # transport ceiling only, set above the STORAGE_MAX_FILE_SIZE_BYTES policy (50 MiB default) so
  # the service — not the container — decides what is acceptable. To change the real limit, change
  # the policy, not this.
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 64MB

  # Set which profile is active
  profiles:
    active: dev
  
  springdoc:
    api-docs:
      path: /api-docs
    swagger-ui:
      path: /swagger-ui.html
      operations-sorter: alpha
      tags-sorter: alpha
      display-request-duration: true
      filter: true
    show-actuator: false

server:
  port: 6969
#
#logging:
#  level:
#    org.springdoc: DEBUG
#    org.springframework.web: DEBUG

jwt:
  access-expiry: 86400000
  refresh-expiry: 604800000
  token-expiry: 86400000

# MyBatis Configuration
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lawfirm.erp.dto.admin.response
  type-handlers-package: com.lawfirm.erp.config
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Config encryption key for AES-256 (32 bytes, Base64-encoded)
# Generate with: openssl rand -base64 32
config:
  encryption:
    key: ${CONFIG_ENCRYPTION_KEY:rFBpF36+KeLlIKw+m6RiNCJmEmRZcoLXVgeKRY+bNWw=}

# Object storage (MinIO or any S3-compatible endpoint) — used by the document store.
# Everything storage-related is read from this block; no other module touches MinIO config.
storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:tarikh-documents}
    region: ${MINIO_REGION:us-east-1}
    # Presigned URL lifetimes: uploads 30 min, downloads 15 min.
    upload-expiry-seconds: 1800
    download-expiry-seconds: 900
    max-file-size-bytes: 52428800        # 50 MB per file
    default-quota-bytes: 5368709120      # 5 GB allocated to a firm with no explicit quota

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# Login lockout (LOGIN_MAX_ATTEMPTS / LOGIN_LOCK_MINUTES), MFA policy
# (MFA_ENABLED / MFA_REQUIRED_ROLES) and production mode (APP_PRODUCTION) are
# DB-driven — see the GLOBAL settings registry in SystemConfigService.

permissions:
  cache:
    ttl-ms: 300000  # 5 minutes
