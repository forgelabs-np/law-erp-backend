# src/main/resources/application.yml
spring:
  application:
    name: NepalCRM

  # Set which profile is active
  profiles:
    active: dev
  
  springdoc:
    api-docs:
      path: /api-docs
    swagger-ui:
      path: /swagger-ui.html
      operations-sorter: alpha
      tags-sorter: alpha
      display-request-duration: true
      filter: true
    show-actuator: false

server:
  port: 6969
#
#logging:
#  level:
#    org.springdoc: DEBUG
#    org.springframework.web: DEBUG

jwt:
  access-expiry: 86400000
  refresh-expiry: 604800000
  token-expiry: 86400000

security:
  max-login-attempts: 5