# src/main/resources/application.yml
spring:
  application:
    name: NepalCRM

  # Set which profile is active
  profiles:
    active: prod
  
  springdoc:
    api-docs:
      path: /api-docs
    swagger-ui:
      path: /swagger-ui.html
      operations-sorter: alpha
      tags-sorter: alpha
      display-request-duration: true
      filter: true
    show-actuator: false

server:
  port: 6969
#
#logging:
#  level:
#    org.springdoc: DEBUG
#    org.springframework.web: DEBUG

jwt:
  access-expiry: 86400000
  refresh-expiry: 604800000
  token-expiry: 86400000

# MyBatis Configuration
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lawfirm.erp.dto.admin.response
  type-handlers-package: com.lawfirm.erp.config
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Config encryption key for AES-256 (32 bytes, Base64-encoded)
# Generate with: openssl rand -base64 32
config:
  encryption:
    key: ${CONFIG_ENCRYPTION_KEY:0cFimdLRoLOM/g/Z6hl9nzL+5SPQp3mDixwPgk66k4U=}

security:
  max-login-attempts: 5
