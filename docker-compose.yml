# Local object storage for the document store.
#
#   docker compose up -d
#   No web console: this MinIO build serves the API on :9000 only (the embedded browser UI was
#   removed upstream), so nothing listens on :9001. Inspect the store with `mc` inside the container
#   or the app's own API. See docs/minioConfiguration.md §5.6.
#
# The application creates the bucket on startup, so there is no init step. The bucket is
# private — nothing is ever served without a presigned URL.
#
# ── Image note (2026-10-03) ────────────────────────────────────────────────────────────────
# MinIO pulled its distribution on 2026-09-11: `minio/minio` was deleted from Docker Hub
# (404), the quay.io mirror now requires auth, and the official binaries at dl.min.io return
# 410 Gone. This is a STOPGAP for local development only — the Bitnami legacy image still
# ships the real MinIO server (RELEASE.2025-07-23) and is a drop-in for the env vars and
# ports used here, but it is frozen (last pushed 2025-08-19) and will need replacing with a
# maintained S3-compatible server (SeaweedFS / Garage / RustFS / a managed S3) before this is
# used anywhere but a developer machine.
services:
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: tarikh-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API — the app and the browser both talk to this
      - "9001:9001"   # web console
    volumes:
      # Bind-mounted so the objects are real files on the host. See docs/minioConfiguration.md §6.
      - ./data/minio:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

